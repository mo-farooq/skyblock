name: "🕹️ Skyblock Move"
description: "Execute a move or action on the Skyblock island"
title: "Move: Step Forward"
labels: ["skyblock-turn"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🏝️ Minecraft Skyblock Multiplayer Realm
        > **Click the green "Create" button below to execute this turn!**
        
        The autonomous game engine will process your move, update Steve's position on the island, and re-render the 3D world in ~15 seconds.
  - type: input
    id: command
    attributes:
      label: Action Command
      description: The game action being executed
    validations:
      required: true
