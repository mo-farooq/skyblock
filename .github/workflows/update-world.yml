name: Skyblock Multiplayer Engine

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: skyblock-turn-queue
  cancel-in-progress: false

jobs:
  process-turn:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.issue.title, 'Move') ||
      startsWith(github.event.issue.title, 'move') ||
      startsWith(github.event.issue.title, 'Action') ||
      startsWith(github.event.issue.title, 'action') ||
      startsWith(github.event.issue.title, 'Craft') ||
      startsWith(github.event.issue.title, 'craft') ||
      startsWith(github.event.issue.title, 'Mine') ||
      startsWith(github.event.issue.title, 'mine') ||
      startsWith(github.event.issue.title, 'Build') ||
      startsWith(github.event.issue.title, 'build')

    steps:
      - name: Fast Shallow Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check if already processed by Vercel Engine
        id: check_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json state -q .state 2>/dev/null || echo "OPEN")
          if [ "$STATUS" = "CLOSED" ]; then
            echo "⚡ Issue #${{ github.event.issue.number }} was already processed by Vercel in <1s!"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Process Skyblock Turn & Re-render World
        if: steps.check_status.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/process-move.js

      - name: Commit and Push Updated Skyblock Realm
        if: steps.check_status.outputs.skip != 'true'
        run: |
          git config --global user.name "Skyblock Bot"
          git config --global user.email "skyblock-bot@mo-farooq.github"
          git config --global commit.gpgSign false
          git add world-3d.svg renders/ data/world-state.json README.md
          git commit -m "🏝️ Skyblock Turn #${{ github.event.issue.number }} executed by @${{ github.event.issue.user.login }} [skip ci]" || echo "No changes to commit"
          git push --atomic origin main
